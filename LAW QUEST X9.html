<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LAW QUEST X9</title>
<style>
:root{--bg:#f4f6fb;--fg:#10203f;--card:#fff;--navy:#14284b;--gold:#c8961e;--ok:#1a7f4b;--bad:#b3261e;--mut:#5b6785;--ln:#d5dbe8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1730;--fg:#e9eefb;--card:#16244a;--navy:#243a6e;--gold:#e6b43c;--ok:#5fd394;--bad:#ff8a80;--mut:#a9b5d6;--ln:#2d3f6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1730;--fg:#e9eefb;--card:#16244a;--navy:#243a6e;--gold:#e6b43c;--ok:#5fd394;--bad:#ff8a80;--mut:#a9b5d6;--ln:#2d3f6e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{margin:.2em 0;font-size:1.9rem}h2{font-size:1.2rem}
.top{background:var(--navy);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;gap:8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:12px 0}
.btn,.opt{display:block;width:100%;min-height:48px;margin:8px 0;padding:10px 14px;border-radius:12px;border:2px solid var(--ln);background:var(--card);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.btn{background:var(--gold);border-color:var(--gold);color:#10203f;font-weight:700;text-align:center}
.btn.g{background:var(--card);color:var(--fg);border-color:var(--ln)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.bad{border-color:var(--bad);opacity:.7}
.okt{color:var(--ok);font-weight:700}.bad{color:var(--bad)}
input,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border:2px solid var(--ln);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.mut{color:var(--mut);font-size:.9rem}.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="top"><span>⚖️ LAW QUEST X9</span><span id="st"></span></div>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),A=$("#app"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DB=null,DL=null,S=null;
const ready=window.claude?Promise.race([Promise.all([claude.use("db").then(d=>DB=d),claude.use("downloads").then(d=>DL=d)]).catch(()=>{}),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
const L={g(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sid=(k,a)=>(k+"-"+a).replace(/[^A-Za-z0-9_-]/g,"_");
async function save(c,id,o){L.s(c+":"+id,o);const x=L.g("idx:"+c)||[];if(!x.includes(id)){x.push(id);L.s("idx:"+c,x)}if(DB)try{await DB.collection(c).doc(id).set(o)}catch(e){}}
async function load(c,id){if(DB)try{const s=await DB.collection(c).doc(id).get();if(s.exists)return s.data()}catch(e){}return L.g(c+":"+id)}
async function list(c){const m={};(L.g("idx:"+c)||[]).forEach(i=>m[i]=L.g(c+":"+i));if(DB)try{const s=await DB.collection(c).get();s.docs.forEach(d=>m[d.id]=d.data())}catch(e){}return Object.values(m).filter(Boolean)}
const sv=()=>save("siswa",S.id,S);
const SL=[
{t:"Kesadaran Hukum",p:["Tahu aturan, paham alasannya, lalu menaatinya dengan sadar.","Bukan karena takut sanksi atau diawasi."],r:"Mengapa aturan diperlukan dalam kehidupan bersama?"},
{t:"Tujuan Hukum",p:["Ketertiban dan ketenteraman","Keadilan","Perlindungan hak dan kewajiban","Penyelesaian konflik"]},
{t:"Sumber Hukum",p:["Tertulis: UUD 1945, undang-undang, peraturan daerah.","Tidak tertulis: hukum adat dan kebiasaan yang ditaati."],r:"Apa akibatnya jika orang tahu aturan tetapi tidak menerapkannya?"},
{t:"Jenis Norma",p:["Norma agama","Norma kesusilaan","Norma kesopanan","Norma hukum: sanksi tegas dari negara"]}];
const PRE=[
["Kesadaran hukum berarti…",["Taat hanya saat diawasi","Memahami aturan dan menaatinya dengan sadar","Menghafal semua pasal","Menghindari sanksi"],1,"","Kesadaran hukum adalah memahami aturan dan menaatinya atas kemauan sendiri."],
["Contoh sumber hukum tertulis adalah…",["Hukum adat","Kebiasaan setempat","Undang-Undang","Nasihat orang tua"],2,"","Undang-Undang tertulis dan resmi."],
["Norma dengan sanksi tegas dari negara adalah…",["Norma agama","Norma kesopanan","Norma kesusilaan","Norma hukum"],3,"","Hanya norma hukum yang sanksinya dipaksakan negara."]];
const POST=[
["Tujuan hukum yang menjaga masyarakat hidup teratur adalah…",["Ketertiban","Persaingan","Hiburan","Kemewahan"],0,"","Ketertiban adalah salah satu tujuan utama hukum."],
["Siswa tahu dilarang mencontek tetapi tetap mencontek. Berarti…",["Kesadaran hukumnya tinggi","Tahu aturan tetapi belum menaatinya","Sudah taat hukum","Tidak tahu aturan"],1,"","Sadar hukum itu tahu sekaligus menaati."],
["Hukum adat termasuk sumber hukum…",["Tertulis","Tidak tertulis","Asing","Tidak berlaku"],1,"","Hukum adat hidup di masyarakat tanpa dituliskan secara resmi."]];
const M=[
{n:"🔎 Gerbang Kesadaran Hukum",q:[
["Rani berhenti di lampu merah walau tidak ada polisi karena paham aturan itu menjaga keselamatan. Ini menunjukkan…",["Takut denda","Kesadaran hukum","Ikut-ikutan","Pencitraan"],1,"Perhatikan alasan Rani.","Rani menaati aturan karena paham manfaatnya."],
["Aldi mengumpulkan tugas tepat waktu hanya jika guru mengawasi. Sikap Aldi…",["Sudah sadar hukum","Belum sepenuhnya sadar hukum","Pasti melanggar pidana","Tidak ada kaitannya"],1,"Apakah ia taat tanpa diawasi?","Taat hanya saat diawasi belum menunjukkan kesadaran."]]},
{n:"⚖️ Ruang Tujuan Hukum",q:[
["Dua siswa berebut kursi dan guru menentukan giliran secara adil. Tujuan hukum yang terlihat…",["Keadilan","Kemewahan","Persaingan","Hiburan"],0,"Giliran yang adil.","Keadilan: setiap orang mendapat haknya."],
["Tata tertib melarang membawa benda tajam agar siswa aman. Tujuannya…",["Mempersulit siswa","Melindungi hak dan rasa aman","Menambah sanksi","Menghemat biaya"],1,"Apa yang dilindungi?","Aturan itu melindungi hak atas rasa aman."]]},
{n:"📚 Arsip Sumber Hukum",q:[
["Peraturan Daerah termasuk sumber hukum…",["Tertulis","Tidak tertulis"],0,"Apakah dibuat dalam dokumen resmi?","Perda adalah peraturan tertulis."],
["Tradisi gotong royong yang ditaati warga tanpa dituliskan termasuk…",["Tertulis","Tidak tertulis"],1,"Apakah ada pasal tertulisnya?","Kebiasaan yang ditaati tanpa tulisan resmi termasuk tidak tertulis."]]},
{n:"🧪 Laboratorium Norma",q:[
["Berdoa sebelum ujian termasuk norma…",["Agama","Hukum","Kesopanan","Kesusilaan"],0,"Berkaitan dengan keyakinan.","Berdoa bersumber dari ajaran agama."],
["Mengucapkan salam saat bertamu termasuk norma…",["Hukum","Agama","Kesopanan","Kesusilaan"],2,"Tentang sopan santun pergaulan.","Salam saat bertamu adalah tata krama (kesopanan)."]]},
{n:"🏫 Tantangan Kehidupan Nyata",q:[
["Kamu melihat teman membuang sampah sembarangan di sekolah. Tindakan terbaik…",["Diam saja","Mengingatkan dengan sopan dan menjelaskan aturannya","Ikut membuang","Memviralkan"],1,"Pilih yang menyelesaikan masalah.","Mengingatkan dengan sopan menumbuhkan kesadaran bersama."],
["Naik motor tanpa helm di jalan raya melanggar…",["Hanya kesopanan","Norma hukum karena diatur undang-undang","Tidak ada norma","Hanya agama"],1,"Ada aturan lalu lintas.","Kewajiban helm diatur undang-undang lalu lintas."]]}];
function quiz(qs,mode,title,done){let i=0,sc=0,pts=0,tr=0;
const show=()=>{const q=qs[i];tr=0;A.innerHTML=`<div class=card><p class=mut>${title} · Soal ${i+1}/${qs.length}</p><h2>${esc(q[0])}</h2><div>${q[1].map((t,j)=>`<button class=opt data-j=${j}>${esc(t)}</button>`).join("")}</div><div id=f></div></div>`;A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.j,b))};
const pick=(j,b)=>{const q=qs[i],ok=j==q[2],f=$("#f");tr++;
const end=g=>{A.querySelectorAll(".opt").forEach((x,k)=>{x.disabled=true;if(k==q[2])x.classList.add("ok")});f.innerHTML=`<p class="${g?"okt":"bad"}">${g?"✓ Tepat, Detektif.":"! Belum tepat. Jawaban benar ditandai."}</p><p>${esc(q[4])}</p><button class=btn id=n>Lanjut →</button>`;$("#n").onclick=()=>{++i<qs.length?show():done(sc,pts)}};
if(ok){sc++;if(mode=="misi")pts+=tr==1?10:5;end(true)}
else if(mode=="misi"&&tr==1){b.disabled=true;b.classList.add("bad");f.innerHTML=`<p class=bad>! Belum tepat. Petunjuk: ${esc(q[3])}</p>`}
else end(false)};show()}
const mast=()=>Math.min(100,Math.round(S.lp/(M.length*20)*100));
function bar(){$("#st").textContent=S?`${S.nama} · LP ${S.lp} · XP ${S.xp}`:""}
function login(){S=null;bar();A.innerHTML=`<h1>LAW QUEST X9</h1><p>Misi Kesadaran Hukum · Pendidikan Pancasila Kelas X</p><p class=mut>“Kenali Aturannya. Pahami Alasannya. Buktikan Sikapmu.”</p><div class=card><label>Nama<input id=n autocomplete=name></label><label>Nomor Absen<input id=a inputmode=numeric></label><label>Kelas (contoh: X-1)<input id=k></label><p id=e class=bad></p><button class=btn id=go>▶ Mulai Belajar</button></div><button class="btn g" id=gr>👩‍🏫 Masuk sebagai Guru</button>`;
$("#gr").onclick=guru;$("#go").onclick=async()=>{const n=$("#n").value.trim(),a=$("#a").value.trim(),k=$("#k").value.trim().toUpperCase();if(!n||!a||!k){$("#e").textContent="! Isi nama, nomor absen, dan kelas.";return}
await ready;const id=sid(k,a);S=(await load("siswa",id))||{id,nama:n,absen:a,kelas:k,step:"materi",pre:null,post:null,lp:0,xp:0,done:[]};S.nama=n;await sv();go()}}
function go(){bar();({materi:slides,pre:()=>test("pre"),map:map,post:()=>test("post"),hasil:hasil})[S.step]()}
function slides(i=0){const s=SL[i];A.innerHTML=`<div class=card><div class=bar><i style="width:${(i+1)/SL.length*100}%"></i></div><p class=mut>📚 Materi · Slide ${i+1}/${SL.length}</p><h2>${s.t}</h2><ul>${s.p.map(x=>`<li>${x}</li>`).join("")}</ul>${s.r?`<p>💡 <b>Renungkan:</b> ${s.r}</p>`:""}</div>${i?`<button class="btn g" id=b>← Sebelumnya</button>`:""}<button class=btn id=x>${i==SL.length-1?"Saya Siap Mengikuti Pretest":"Berikutnya →"}</button>`;
if(i)$("#b").onclick=()=>slides(i-1);$("#x").onclick=()=>{if(i==SL.length-1){S.step="pre";sv();go()}else slides(i+1)}}
function test(w){const qs=w=="pre"?PRE:POST;quiz(qs,"tes",w=="pre"?"📝 Pretest":"🏆 Final Mission · Posttest",async sc=>{S[w]=Math.round(sc/qs.length*100);S.step=w=="pre"?"map":"hasil";if(w=="post")S.fin=new Date().toISOString();await sv();go()})}
function map(){const all=S.done.length==M.length;A.innerHTML=`<h2>🗺️ Mission Map</h2><p>Law Point: ${S.lp} / ${M.length*20} · Mastery: ${mast()}%</p>`+M.map((m,k)=>{const d=S.done.includes(k),lock=!d&&k>S.done.length;return`<button class="opt${d?" ok":""}" data-k=${k} ${lock?"disabled":""}>${lock?"🔒":d?"✓":"▶"} ${m.n}</button>`}).join("")+(all?`<button class=btn id=f>🏆 Lanjut ke Final Mission</button>`:"");
A.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(S.done.includes(k))return;quiz(M[k].q,"misi",M[k].n,async(sc,p)=>{S.lp+=p;S.xp+=p;S.done.push(k);await sv();bar();map()})});
if(all)$("#f").onclick=()=>{S.step="post";sv();go()}}
function hasil(){const m=mast(),ok=m>=70;A.innerHTML=`<h1>HASIL INVESTIGASI</h1><div class=card><p>Pretest: <b>${S.pre}</b> · Posttest: <b>${S.post}</b> · Peningkatan: <b>${S.post-S.pre>=0?"+":""}${S.post-S.pre}</b></p><p>Law Point: <b>${S.lp}/${M.length*20}</b> · Mastery: <b>${m}%</b> · XP: <b>${S.xp}</b></p><h2>${ok?"🏆 PIAGAM KESADARAN HUKUM X9 TERBUKA":"🔎 INVESTIGATION CONTINUES"}</h2><p>${ok?"Lawful Citizen: kamu menuntaskan semua misi.":"Beberapa konsep masih perlu diperkuat."}</p></div>${ok?"":`<button class=btn id=r>Mulai Remedial</button>`}<button class="btn g" id=o>Keluar</button>`;
$("#o").onclick=login;if(!ok)$("#r").onclick=()=>{S.lp=0;S.done=[];S.post=null;S.step="map";sv();go()}}
function guru(){A.innerHTML=`<h2>👩‍🏫 Masuk sebagai Guru</h2><div class=card><label>Nama Guru<input id=n></label><label>Kelas (contoh: X-1)<input id=k></label><label>Kode Akses Guru<input id=c type=password></label><p class=mut>Pertama kali? Kode yang kamu isi akan menjadi kode kelas ini.</p><p id=e class=bad></p><button class=btn id=go>Masuk</button><button class="btn g" id=b>← Kembali</button></div>`;
$("#b").onclick=login;$("#go").onclick=async()=>{const n=$("#n").value.trim(),k=$("#k").value.trim().toUpperCase(),c=$("#c").value;if(!n||!k||!c){$("#e").textContent="! Lengkapi semua isian.";return}
await ready;const h=btoa(unescape(encodeURIComponent(c))),g=await load("guru",sid(k,"g"));if(g&&g.h!=h){$("#e").textContent="! Kode akses salah.";return}if(!g)await save("guru",sid(k,"g"),{nama:n,h});dash(k)}}
const stat=s=>s.post!=null?(Math.min(100,Math.round(s.lp/(M.length*20)*100))<70?"Perlu remedial":"Selesai"):(s.pre==null&&!s.lp?"Belum mulai":"Sedang bermain");
async function dash(k){const rows=(await list("siswa")).filter(s=>s.kelas==k).sort((a,b)=>a.absen-b.absen),av=x=>{const v=rows.map(s=>s[x]).filter(y=>y!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):"-"};
A.innerHTML=`<h2>👩‍🏫 Dashboard · ${esc(k)}</h2>${DB?"":`<p class=mut>Mode lokal: hanya data di perangkat ini yang tampil.</p>`}<div class=card><p>Total siswa: <b>${rows.length}</b> · Selesai: <b>${rows.filter(s=>s.post!=null).length}</b> · Rata-rata pretest: <b>${av("pre")}</b> · posttest: <b>${av("post")}</b></p></div><div class="card wrap"><table><tr><th>Nama<th>Absen<th>Pretest<th>Misi<th>LP<th>Posttest<th>Mastery<th>Status</tr>${rows.map(s=>`<tr><td>${esc(s.nama)}<td>${esc(s.absen)}<td>${s.pre??"-"}<td>${s.done.length}/5<td>${s.lp}<td>${s.post??"-"}<td>${Math.min(100,Math.round(s.lp/100*100))}%<td>${stat(s)}</tr>`).join("")||`<tr><td colspan=8>Belum ada siswa.`}</table></div><label><input type=checkbox id=ck checked style="width:auto;margin:0 8px 0 0">Unduh hanya yang sudah selesai</label><p id=e class=mut></p><button class=btn id=d>⬇️ Unduh Nilai Siswa (CSV)</button><button class="btn g" id=o>Keluar</button>`;
$("#o").onclick=login;$("#d").onclick=async()=>{const r=rows.filter(s=>!$("#ck").checked||s.post!=null);if(!r.length){$("#e").textContent="Belum ada siswa yang selesai.";return}
const q=v=>`"${String(v??"").replace(/"/g,'""')}"`,csv="\ufeff"+["Nama,No. Absen,Kelas,Pretest,Posttest,Improvement,Law Point,Mastery,Progress,Status,Waktu Selesai"].concat(r.map(s=>[q(s.nama),q(s.absen),q(s.kelas),s.pre??"",s.post??"",s.post!=null&&s.pre!=null?s.post-s.pre:"",s.lp,Math.min(100,Math.round(s.lp))+"%",s.done.length+"/5",q(stat(s)),q(s.fin||"")].join(","))).join("\n");
if(!DL){$("#e").textContent="! Unduhan tidak tersedia di tampilan ini.";return}try{await DL.save({filename:`nilai-law-quest-x9-${k}.csv`,data:csv})}catch(e){$("#e").textContent="Unduhan dibatalkan atau gagal."}}}
login();
</script></body></html>
